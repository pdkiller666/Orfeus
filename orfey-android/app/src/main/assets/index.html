<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9962b">
<title>ОРФЕЙ — вокальный тренажёр</title>
<style>
:root{--bg:#f1f3f6;--card:#fafbfc;--tx:#2b2620;--mu:#6f675d;--gold:#8a6212;--gold2:#e8c35f;--sh1:#fff;--sh2:#d5d9e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a17;--card:#25221e;--tx:#f3ece0;--mu:#b0a696;--gold:#e0b04a;--sh1:#2c2823;--sh2:#131110}}
:root[data-theme="dark"]{--bg:#1c1a17;--card:#25221e;--tx:#f3ece0;--mu:#b0a696;--gold:#e0b04a;--sh1:#2c2823;--sh2:#131110}
*{box-sizing:inherit}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:20px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:22px 0 10px}p{margin:6px 0}
.mu{color:var(--mu)}.sm{font-size:15px}
.card{background:var(--card);border-radius:28px;padding:18px;margin-bottom:14px;box-shadow:8px 8px 18px var(--sh2),-8px -8px 18px var(--sh1)}
.row{display:flex;align-items:center;gap:12px}
.brand-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}

.logo-copy{min-width:0}
.logo-copy b{display:block;font-size:22px;letter-spacing:.06em;color:var(--gold)}
.logo-copy small{display:block;font-size:10px;letter-spacing:.28em;color:var(--mu)}
.app-version{display:block;margin-top:2px;color:var(--mu);font-size:10px;line-height:1.2;letter-spacing:0}
.app-update-btn.btn{display:inline-flex;align-items:center;justify-content:center;flex:none;width:auto;min-width:78px;min-height:36px;margin:0;padding:0 14px;border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);border-radius:20px;background:var(--gold-soft);color:var(--gold);box-shadow:none;font-size:12px;line-height:1}
.app-update-btn.btn:active{transform:scale(.96)}
.app-update-btn[hidden]{display:none}
.btn{border:0;border-radius:28px;min-height:56px;padding:0 28px;font-size:18px;font-weight:700;color:#2b1d03;background:linear-gradient(135deg,var(--gold2),#d9a53a);box-shadow:0 10px 22px rgba(201,150,43,.35);width:100%;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1);display:block;text-align:center;text-decoration:none;line-height:56px;margin-bottom:10px}
.btn.s{background:var(--card);color:var(--tx);box-shadow:4px 4px 10px var(--sh2),-4px -4px 10px var(--sh1)}
.btn:active,.pill:active{transform:scale(.96)}
.pill{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:62px;border:0;border-radius:32px;padding:0 22px;margin-bottom:10px;color:#fff;font-size:17px;font-weight:700;text-align:left;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.pill span{font-size:14px;font-weight:600;opacity:.95;white-space:nowrap}.pill.lk{opacity:.55}
.g1{background:linear-gradient(120deg,#7a5410,#8f6616);color:#fff}
.g2{background:linear-gradient(120deg,#a23352,#b5435f)}
.g3{background:linear-gradient(120deg,#4252a8,#5566bf)}
.g4{background:linear-gradient(120deg,#1f6e49,#2a8a5e)}
.g5{background:linear-gradient(120deg,#6b6358,#8f8678)}
.big{font-size:44px;font-weight:800;color:var(--gold)}
nav{display:flex;padding:8px 12px 12px}
nav button{flex:1;min-height:56px;border:0;background:none;color:var(--mu);font-size:13px;font-weight:600;border-radius:24px;cursor:pointer}
nav button.on{color:var(--gold);background:var(--card);box-shadow:4px 4px 10px var(--sh2),-4px -4px 10px var(--sh1)}
nav i{display:block;font-style:normal;font-size:22px}
canvas{width:100%;height:auto;aspect-ratio:8/5;border-radius:24px;background:var(--bg);box-shadow:inset 5px 5px 10px var(--sh2),inset -5px -5px 10px var(--sh1)}
.bar{height:12px;border-radius:6px;background:var(--bg);box-shadow:inset 2px 2px 4px var(--sh2);overflow:hidden}
.lesson-exercise.is-done{outline:2px solid var(--gold2)}.lesson-check{display:flex;align-items:center;gap:12px;min-height:44px;margin-top:12px;cursor:pointer}.lesson-check input{width:22px;height:22px;flex:none;accent-color:var(--gold)}
.bar div{height:100%;background:linear-gradient(90deg,var(--gold2),#d9a53a);transition:width .2s}
.back{background:none;border:0;color:var(--mu);font-size:16px;min-height:48px;cursor:pointer;padding:0}
.warn{border-left:4px solid #d4604a;padding-left:12px;color:var(--mu);font-size:14px;margin:12px 0}
.days{display:flex;gap:8px;margin-top:10px}.days i{flex:1;height:34px;border-radius:12px;background:var(--bg);box-shadow:inset 2px 2px 4px var(--sh2)}.days i.on{background:linear-gradient(135deg,var(--gold2),#d9a53a)}
.bd{display:inline-block;margin:4px;padding:8px 12px;border-radius:20px;background:var(--bg);font-size:14px}.bd.off{opacity:.35}
audio{width:100%;margin:6px 0}

.sample-upload-link,.sample-link{display:block;margin:4px auto 16px;padding:6px 4px;border:0;background:none;color:var(--mu);text-decoration:underline;text-underline-offset:3px;font:inherit;font-size:13px;cursor:pointer}
.sample-upload-link:focus-visible,.sample-link:focus-visible,.sample-external:focus-visible{outline:3px solid var(--gold);border-radius:8px}
.sample-modal{position:fixed;inset:0;z-index:9999;background:rgba(24,21,17,.55);color:var(--tx);display:flex;align-items:flex-end;justify-content:center;padding:10px;box-sizing:border-box;overscroll-behavior:contain}
.sample-sheet{position:relative;width:100%;max-width:620px;max-height:84vh;max-height:84dvh;overflow-y:auto;overscroll-behavior:contain;margin:0 auto;padding:12px 18px max(24px,env(safe-area-inset-bottom,0px));border-radius:28px 28px 18px 18px;background:var(--bg);box-shadow:0 20px 60px rgba(0,0,0,.35)}.sample-sheet::before{content:"";display:block;width:42px;height:4px;margin:0 auto 10px;border-radius:4px;background:var(--mu);opacity:.4}
.sample-close{position:sticky;top:0;float:right;width:44px;height:44px;border:0;border-radius:50%;background:var(--card);color:var(--tx);font-size:30px;z-index:2}
.sample-field{display:block;margin:14px 0;color:var(--tx);font-size:14px}
.sample-field input,.sample-field textarea{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--mu) 28%,transparent);border-radius:16px;background:var(--card);color:var(--tx);font:inherit;font-size:16px}
.sample-field input[type=range]{padding:8px 0;accent-color:var(--gold)}
.sample-rec-controls{display:flex;gap:10px;margin:16px 0}.sample-rec-controls .btn{flex:1}
.sample-consent{display:flex;align-items:flex-start;gap:10px;padding:15px;margin:14px 0;border-radius:18px;background:var(--card);font-size:14px;line-height:1.45}
.sample-consent input{width:22px;height:22px;flex:none;accent-color:var(--gold)}
.sample-warning{padding:14px;margin:14px 0;border-radius:18px;background:var(--card);line-height:1.45}
.sample-external{display:inline-block;color:var(--gold);text-decoration:underline;text-underline-offset:3px;margin:8px 0}
.exercise-primary-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 16px}.exercise-primary-actions .btn{display:flex;align-items:center;justify-content:center;gap:9px;min-height:64px;height:auto;margin:0;padding:10px 12px;border-radius:20px;font-size:15px;line-height:1.2;white-space:normal}.sample-tools{padding:14px 16px;margin:0 0 14px}.sample-tools-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.sample-tools-head>b{font-size:14px}.sample-tools .sample-upload-link{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;margin:0;padding:7px 11px;border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);border-radius:999px;color:var(--gold);text-decoration:none;font-size:13px;font-weight:650;white-space:nowrap}.sample-tools .sample-upload-link:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.sample-tools .sample-public{margin:10px 0 0;padding:10px 12px;border-radius:16px;background:var(--bg);box-shadow:none}.sample-tools .sample-link{margin:6px 0 0}.sample-public>summary{min-height:32px;display:list-item;cursor:pointer;color:var(--mu);font-size:14px;line-height:32px}.sample-public>summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}.sample-public-content{padding-top:8px}.sample-public audio{display:block;width:100%;margin:10px 0}

:root{--ui-line:rgba(55,47,34,.12);--ui-elev:0 3px 14px rgba(40,34,24,.06);--gold-soft:rgba(201,150,43,.13)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ui-line:rgba(245,236,224,.12);--ui-elev:0 3px 16px rgba(0,0,0,.2);--gold-soft:rgba(224,176,74,.13)}}
:root[data-theme="dark"]{--ui-line:rgba(245,236,224,.12);--ui-elev:0 3px 16px rgba(0,0,0,.2);--gold-soft:rgba(224,176,74,.13)}
main{padding:18px 18px 20px;scrollbar-width:thin;scrollbar-color:var(--ui-line) transparent}
.card{border:1px solid var(--ui-line);border-radius:22px;box-shadow:var(--ui-elev);padding:16px;margin-bottom:12px}
.btn{min-height:52px;height:auto;padding:14px 18px;margin-bottom:8px;border-radius:16px;background:linear-gradient(135deg,var(--gold2),#dfb347);box-shadow:none;font-size:16px;line-height:1.2;transition:transform .14s ease,filter .14s ease}
.btn.s{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1px solid var(--ui-line);color:var(--tx);box-shadow:none}
.btn:active,.pill:active{transform:scale(.985);filter:brightness(.98)}
.btn:focus-visible,.pill:focus-visible,#nav button:focus-visible,.training-filter:focus-visible,.training-category:focus-visible,.training-item:focus-visible,.lesson-card:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.pill{min-height:58px;border-radius:18px;padding:13px 16px;margin-bottom:8px;box-shadow:none;font-size:15px;line-height:1.3}
#nav{gap:4px;padding:7px 12px max(8px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--ui-line);background:var(--bg)}
#nav button{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;min-height:60px;padding:5px 2px;border-radius:16px;font-size:11px;line-height:1.15;transition:background .15s ease,color .15s ease}
#nav button.on{background:var(--gold-soft);box-shadow:none;color:var(--gold)}
.ui-icon{display:inline-block;flex:none;vertical-align:middle}
.nav-icon{width:22px;height:22px}.icon-badge{display:grid;place-items:center;width:42px;height:42px;flex:none;border-radius:14px;background:var(--gold-soft);color:var(--gold)}
.training-header{margin-bottom:14px}.training-search-wrap{position:relative;margin:12px 0 14px}.training-search-wrap .ui-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mu)}.training-search{width:100%;min-height:50px;padding:0 16px 0 46px;border:1px solid var(--ui-line);border-radius:16px;background:var(--card);color:var(--tx);font:inherit;font-size:16px;box-shadow:var(--ui-elev)}
.training-category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.training-category{display:flex;min-height:104px;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px;border:1px solid var(--ui-line);border-radius:20px;background:var(--card);color:var(--tx);text-align:left;box-shadow:var(--ui-elev);cursor:pointer}.training-category-top{display:flex;width:100%;align-items:center;justify-content:space-between}.training-category b{font-size:15px;line-height:1.25}.training-category small{color:var(--mu);font-size:12px}.training-filters{position:sticky;top:-18px;z-index:3;display:flex;gap:8px;overflow-x:auto;margin:0 -18px 12px;padding:10px 18px;background:var(--bg);scrollbar-width:none}.training-filters::-webkit-scrollbar{display:none}.training-filter{flex:none;min-height:38px;padding:8px 14px;border:1px solid var(--ui-line);border-radius:999px;background:var(--card);color:var(--mu);font:inherit;font-size:13px;font-weight:650;white-space:nowrap;cursor:pointer}.training-filter[aria-pressed="true"]{border-color:transparent;background:var(--gold-soft);color:var(--gold)}
.training-list{display:grid;grid-template-columns:1fr;gap:8px}.training-item{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 14px;border:1px solid var(--ui-line);border-radius:18px;background:var(--card);color:var(--tx);text-align:left;box-shadow:var(--ui-elev);cursor:pointer}.training-item-copy{display:flex;min-width:0;flex:1;flex-direction:column;gap:3px}.training-item-copy b{font-size:15px;line-height:1.25}.training-item-copy small{color:var(--mu);font-size:12px}.training-item-status{display:flex;align-items:center;gap:5px;color:var(--mu);font-size:12px;white-space:nowrap}.training-list-empty{padding:20px;border:1px dashed var(--ui-line);border-radius:18px;color:var(--mu);text-align:center}
.lesson-card{display:flex;width:100%;align-items:center;gap:12px;min-height:72px;margin:0 0 9px;padding:12px 14px;border:1px solid var(--ui-line);border-radius:18px;background:var(--card);color:var(--tx);text-align:left;box-shadow:var(--ui-elev);cursor:pointer}.lesson-card-copy{display:flex;min-width:0;flex:1;flex-direction:column;gap:4px}.lesson-card-copy b{font-size:15px;line-height:1.25}.lesson-card-copy small{color:var(--mu);font-size:12px}.lesson-card.done .icon-badge{background:rgba(47,143,98,.12);color:#2f8f62}.lesson-card-status{color:var(--mu);font-size:12px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{min-height:40px;border:1px solid var(--ui-line);border-radius:999px;background:var(--card);color:var(--mu);font:inherit;font-size:13px;cursor:pointer}.chip.on{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.tool-disclosure{margin:12px 0;border:1px solid var(--ui-line);border-radius:18px;background:var(--card);box-shadow:var(--ui-elev);overflow:hidden}.tool-disclosure>summary{display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 14px;color:var(--tx);font-weight:650;cursor:pointer;list-style:none}.tool-disclosure>summary::-webkit-details-marker{display:none}.tool-disclosure>summary::after{content:"＋";margin-left:auto;color:var(--mu);font-size:18px}.tool-disclosure[open]>summary::after{content:"−"}.tool-disclosure-body{padding:0 14px 12px}.lesson-sections{display:grid;gap:10px}.lesson-section{padding:14px;border:1px solid var(--ui-line);border-radius:18px;background:var(--card)}.lesson-section summary{display:flex;align-items:center;gap:9px;min-height:28px;font-weight:650;cursor:pointer;list-style:none}.lesson-section summary::-webkit-details-marker{display:none}.lesson-section[open] summary{margin-bottom:8px}
@media(min-width:640px){#app{max-width:640px}.training-category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.training-list{grid-template-columns:repeat(2,minmax(0,1fr))}.training-item{min-height:86px}}
@media(prefers-reduced-motion:reduce){.btn,.pill,#nav button{transition:none!important}}
.today-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.today-metric{display:flex;align-items:center;gap:10px;min-width:0;margin:0;padding:13px;border-radius:18px}
.today-metric .icon-badge{width:38px;height:38px;border-radius:13px}
.today-metric-copy{display:flex;min-width:0;flex-direction:column;gap:2px}
.today-metric-value{font-size:23px;line-height:1.1;font-variant-numeric:tabular-nums}
.today-metric-copy>span{font-size:13px;font-weight:650}
.today-metric-copy small{color:var(--mu);font-size:11px;line-height:1.25}
.today-level{margin-bottom:10px;padding:14px 16px}
.today-level-head,.profile-card-head{display:flex;align-items:center;gap:11px;min-width:0}
.today-level-copy,.profile-card-copy{display:flex;min-width:0;flex:1;flex-direction:column;gap:3px}
.today-level-copy small,.profile-card-copy small{color:var(--mu);font-size:12px}
.today-recommendation{margin-bottom:10px;padding:14px 16px}
.today-recommendation .profile-card-copy>b{font-size:15px;line-height:1.25}
.today-recommendation .profile-card-copy p{margin:3px 0 0}
.today-start{width:100%;margin:0 0 10px}
.today-safety{margin:0 0 12px}
.lesson-search-wrap{margin:8px 0 10px}
.lesson-filters{margin-bottom:10px}
.lesson-list .lesson-card{margin:0}
.lesson-list-empty{grid-column:1/-1}
.lesson-title{display:flex;align-items:center;gap:10px}
.lesson-title .icon-badge{width:40px;height:40px}
.back-button{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin:0 0 10px;padding:7px 12px;border:1px solid var(--ui-line);border-radius:13px;background:var(--card);color:var(--mu);font:inherit;font-size:14px;font-weight:650;cursor:pointer}
.back-button .ui-icon{color:var(--gold)}
.back-button:focus-visible,.profile-action-row:focus-visible,.profile-time-input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.profile-header{margin-bottom:12px}
.profile-overview{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(118px,.8fr);gap:10px;margin:12px 0}
.profile-range-card,.profile-week-card{min-width:0;margin:0;padding:13px;border-radius:18px}
.profile-range-card{display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;gap:12px}
.profile-range-main{display:flex;align-items:center;gap:10px;min-width:0}
.profile-range-main .icon-badge{width:38px;height:38px}
.profile-range-copy{display:flex;min-width:0;flex-direction:column;gap:3px}

.profile-range-value{font-size:16px;font-weight:750;line-height:1.2;overflow-wrap:anywhere}
.profile-range-card .btn{min-height:42px;margin:0;padding:9px 11px;border-radius:13px;font-size:13px}
.profile-week-card{display:flex;flex-direction:column;justify-content:center;gap:5px}
.profile-week-value{font-size:24px;font-weight:750;font-variant-numeric:tabular-nums}
.profile-week-card small{color:var(--mu);font-size:12px;line-height:1.25}
.profile-disclosure>summary{min-height:58px}
.profile-disclosure>summary .profile-summary-copy{display:flex;min-width:0;flex:1;flex-direction:column;gap:3px}
.profile-summary-copy small{color:var(--mu);font-size:11px;font-weight:400;line-height:1.25}
.profile-subsection{padding:10px 0;border-top:1px solid var(--ui-line)}
.profile-subsection:first-child{border-top:0}
.profile-subsection>b{display:block;margin-bottom:8px;font-size:14px}
.profile-days{display:flex;align-items:stretch;gap:5px}
.profile-day{display:flex;min-width:0;flex:1;flex-direction:column;align-items:center;gap:5px;color:var(--mu);font-size:10px;text-align:center}

.profile-day.active i{border-color:var(--gold);background:var(--gold)}
.profile-chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end}

.profile-chart-track i{display:block;width:100%;min-height:3px;border-radius:7px 7px 0 0;background:linear-gradient(var(--gold2),#d9a53a)}
.profile-chart-day b{color:var(--tx);font-size:10px;font-variant-numeric:tabular-nums}
.profile-data-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ui-line);font-size:13px}

.profile-badges{display:flex;flex-wrap:wrap;gap:6px}
.profile-setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--ui-line)}
.profile-setting-copy{display:flex;min-width:0;flex:1;flex-direction:column;gap:3px}
.profile-setting-copy small{color:var(--mu);font-size:12px;line-height:1.35}
.profile-setting-row input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--gold)}
.profile-time-input{min-height:44px;padding:0 10px;border:1px solid var(--ui-line);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.profile-setting-action{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 0}
.profile-action-list{display:grid;gap:8px;padding:0 0 4px}
.profile-action-row{display:flex;width:100%;min-height:58px;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--ui-line);border-radius:16px;background:var(--card);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.profile-action-row .icon-badge{width:36px;height:36px;border-radius:12px}
.profile-action-copy{display:flex;min-width:0;flex:1;flex-direction:column;gap:2px}
.profile-action-copy small{color:var(--mu);font-size:11px}
.profile-action-trail{color:var(--mu)}
.profile-booking{display:flex;align-items:center;gap:11px;margin:12px 0}
.profile-booking-copy{display:flex;min-width:0;flex:1;flex-direction:column;gap:3px}
.profile-booking-copy small{color:var(--mu);font-size:12px}
.profile-booking .btn{width:auto;flex:none;margin:0;padding:11px 13px;font-size:13px}
.profile-nps .chips{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 8px}
.profile-nps .chip{min-width:42px;min-height:42px;padding:7px}
.profile-data-textarea{width:100%;min-height:190px;box-sizing:border-box;border:1px solid var(--ui-line);border-radius:14px;padding:12px;background:var(--card);color:var(--tx);font:13px monospace}
@media(max-width:360px){.today-summary-grid{gap:8px}.today-metric{gap:7px;padding:10px}.today-metric .icon-badge{width:34px;height:34px}.profile-overview{grid-template-columns:1fr}.profile-range-card{gap:8px}.profile-booking{align-items:stretch;flex-direction:column}.profile-booking .btn{width:100%}}
@media(min-width:640px){.lesson-list{grid-template-columns:repeat(2,minmax(0,1fr))}.lesson-list .lesson-card{min-height:82px}}

@media(prefers-reduced-motion:reduce){.sample-modal *{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

.exercise-primary-actions .btn-sample{background:var(--gold-soft);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 32%,transparent);box-shadow:none}
.exercise-primary-actions .btn-sample:hover{background:color-mix(in srgb,var(--gold) 18%,var(--card))}
.exercise-primary-actions .btn-sample[aria-pressed="true"]{background:linear-gradient(135deg,var(--gold2),#dfb347);border-color:transparent;color:#2b1d03;box-shadow:0 4px 12px rgba(201,150,43,.22)}
.exercise-primary-actions .btn-start{background:linear-gradient(135deg,var(--gold2),#dfb347);box-shadow:0 4px 12px rgba(201,150,43,.22)}
.sample-public>summary{display:flex;align-items:center;gap:10px;min-height:52px;padding:7px 4px;line-height:1.2;list-style:none}
.sample-public>summary::-webkit-details-marker{display:none}
.sample-public-summary-copy{display:flex;min-width:0;flex:1;flex-direction:column;gap:3px}
.sample-public-summary-copy strong{font-size:13px;line-height:1.25}
.sample-public-summary-copy small{overflow:hidden;color:var(--mu);font-size:12px;line-height:1.25;text-overflow:ellipsis;white-space:nowrap}
.sample-public-chevron{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:10px;background:var(--card);color:var(--mu);transition:transform .16s ease}
.sample-public[open] .sample-public-chevron{transform:rotate(90deg)}
.sample-public-description{margin:2px 0 8px;color:var(--mu);font-size:13px;line-height:1.45}
.sample-public-meta{margin:0 0 8px;color:var(--mu);font-size:11px;line-height:1.4}
.sample-player{display:flex;align-items:center;gap:12px;margin:12px 0;padding:12px;border:1px solid var(--ui-line);border-radius:18px;background:var(--card);box-shadow:var(--ui-elev)}
.sample-player-toggle{display:grid;place-items:center;width:50px;height:50px;flex:none;border:0;border-radius:16px;background:linear-gradient(135deg,var(--gold2),#dfb347);color:#2b1d03;cursor:pointer;transition:transform .14s ease,filter .14s ease}
.sample-player-toggle:active{transform:scale(.96);filter:brightness(.97)}
.sample-player-toggle:focus-visible,.sample-player-seek:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sample-player-main{min-width:0;flex:1}
.sample-player-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sample-player-label{overflow:hidden;font-size:13px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.sample-player-time{flex:none;color:var(--mu);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sample-player-seek{display:block;width:100%;height:22px;margin:4px 0 0;padding:0;accent-color:var(--gold);cursor:pointer}
.sample-player-status{display:block;min-height:16px;color:var(--mu);font-size:11px;line-height:1.35}
.sample-player-status[data-state="playing"]{color:var(--gold);font-weight:650}
.sample-rec-controls .sample-record-start{border:1px solid color-mix(in srgb,var(--gold) 32%,transparent);background:var(--gold-soft);color:var(--gold);box-shadow:none}
.sample-rec-controls .sample-record-stop:not(:disabled){border:1px solid rgba(174,60,53,.25);background:rgba(174,60,53,.10);color:#ae3c35;box-shadow:none}
.sample-rec-controls .sample-record-stop:disabled{opacity:.58}
@media(max-width:360px){.brand-header{gap:6px}.brand-header .logo{gap:8px}.logo-copy small{font-size:9px;letter-spacing:.18em}.app-update-btn.btn{min-width:72px;padding:0 10px;font-size:11px}.exercise-primary-actions{gap:8px}.exercise-primary-actions .btn{min-height:60px;padding:9px 8px;font-size:14px}.sample-player{gap:9px;padding:10px}.sample-player-toggle{width:46px;height:46px}}
@media(prefers-reduced-motion:reduce){.sample-public-chevron,.sample-player-toggle{transition:none!important}}
</style></head>

const seqEx=(offs,step)=>({offs,step,dur:offs.length*step,f(fr,t,st){const i=Math.min(offs.length-1,t/step|0),m=base()+offs[i];if(st.i!==i){st.i=i;if(step>=2||i==0){tone(fq(m));st.mute=t+.75}}
 const o={band:[-30,30],r:[-150,150],tg:nn(m),msg:"Пойте: "+nn(m)};if(t<(st.mute||0)){o.msg="Слушайте ноту "+nn(m)+"…";return o}if(fr.f<0)return o;const c=1200*Math.log2(fr.f/fq(m)),a=Math.abs(c);
 o.v=Math.max(-300,Math.min(300,c));o.ok=a<=30;o.msg=o.ok?"Отлично! "+nn(m):"Почти! "+(c>0?"выше":"ниже")+" на "+Math.round(a)+" центов — "+OrfeyCore.pitchCue(c);return o}});
const lvEx=ph=>({dur:ph.reduce((a,p)=>a+p.d,0),f(fr,t){let a=0,p;for(p of ph){if(t<a+p.d)break;a+=p.d}
 const o={band:[p.lo,p.hi],r:[-70,0],msg:p.n+" — пойте"};if(fr.db<-60)return o;o.v=fr.db;o.ok=fr.db>=p.lo&&fr.db<=p.hi;
 o.msg=p.n+": "+(o.ok?"в зоне!":fr.db>p.hi?"отодвиньте микрофон":"приблизьтесь");return o}});

 o.v=Math.min(1,fr.hi*4);o.ok=fr.hi*4>=thr&&fr.db>=minDb;o.msg=o.ok?nm+" — есть!":tip;return o}});

const D=({"LS":[{"id":"mic","e":"🎤","t":"Техника микрофона","l":"b","xp":60,"dr":"15 мин","d":"Правильная работа с микрофоном раскрывает весь потенциал голоса. Расстояние, угол, хват — всё это влияет на итоговый звук и качество записи.","ex":[{"n":"Правильный хват","d":"Держите микрофон в нижней трети капсюля под углом 45° к губам. Не закрывайте решётку ладонью — это вызывает обратную связь и срезает высокие частоты."},{"n":"Работа с расстоянием","d":"Для мощных нот отодвигайте микрофон на 15–20 см, для интимных — приближайте до 3–5 см. Тренируйтесь переходить между позициями плавно во время пения."},{"n":"Взрывные согласные П/Б/Т","d":"Направляйте взрывной воздух мимо микрофона, слегка отворачивая голову. Практикуйте фразу: «Певец поёт прекрасно» — следите за ровностью уровня."},{"n":"Динамическая работа","d":"Пойте от шёпота до forte — двигайтесь с микрофоном, а не только голосом. Общий уровень должен быть стабильным. Запишите себя и послушайте."},{"n":"Поведение на сцене","d":"При движении поворачивайтесь корпусом, а не только головой. Шнур — вниз свободно. Никогда не направляйте микрофон на напольные мониторы."}],"tips":["Держите одной рукой — это стабилизирует звук","Не «съедайте» капсюль — 5–10 см до губ","Шнур должен свисать вниз свободно","Поворачивайтесь корпусом при движении по сцене"],"err":["Закрывать капсюль ладонью","Держать вплотную при громком пении","Направлять на монитор — будет свист","Слишком крепко сжимать — вибрация руки слышна"]},{"id":"pitch","e":"🎵","t":"Попадание в ноты","l":"b","xp":80,"dr":"20 мин","d":"Точное интонирование — фундамент вокала. Это навык, который развивается только ежедневной практикой. Используйте встроенный тюнер для мгновенной обратной связи.","ex":[{"n":"Унисон со звуком","d":"Слушайте ноту До (261 Гц) и подстраивайте голос. Начните с \"мм-мм\", затем переходите к \"а\". Цель — ноль центов отклонения по тюнеру. Используйте упражнение «Тюнер»!"},{"n":"Скользящий слайд","d":"Начните с низкой ноты и медленно скользите вверх через все ноты гаммы, останавливаясь на каждой на 3 секунды. Почувствуйте разницу ощущений в горле."},{"n":"Прыжки по интервалам","d":"Пойте До–Соль–До (квинта и октава), затем До–Ля–До. Запомните \"мышечное ощущение\" каждого интервала. Это строит внутренний слух."},{"n":"Удержание ноты 10 сек","d":"Выберите ноту и держите ровно 10 секунд. Тюнер — стрелка должна быть абсолютно стабильной. Начните с До, пройдите все ноты гаммы."},{"n":"Угадай ноту","d":"Включите тюнер, откройте игру «Попади в ноту» в разделе «Тренировки». Пойте и набирайте очки! Добейтесь точности 80%+."}],"tips":["Пойте на \"нг\" — помогает найти правильный резонанс","Записывайте себя и критически слушайте","Занимайтесь ежедневно хотя бы 10 минут","Играйте в «Попади в ноту» — это весело и быстро улучшает слух!"],"err":["Петь слишком громко — теряется контроль над интонацией","Пропускать распевку перед занятием","Не использовать тюнер как ориентир","Зажимать шею и плечи при попытке попасть в ноту"]},{"id":"vibrato","e":"🌊","t":"Вибрато","l":"m","xp":100,"dr":"25 мин","d":"Вибрато — равномерные колебания высоты тона (5–8 Гц). Возникает при правильной певческой опоре и расслабленной гортани. Не форсируется — развивается постепенно.","ex":[{"n":"Диафрагмальный толчок","d":"Держите ноту \"а\" и делайте лёгкие толчки диафрагмой, как при смехе \"ха-ха-ха\". Начните медленно (2 Гц), постепенно ускоряйте до 5–6 Гц. Это имитирует вибрато."},{"n":"Вибрато на \"мм\"","d":"Поём \"мм\" на удобной ноте. Начинаем с прямого тона, затем позволяем голосу \"задрожать\" естественно. Не форсируйте — ищите расслабление в гортани."},{"n":"Прямой тон / вибрато","d":"Пойте ноту 2 сек прямо, затем 2 сек с вибрато. Чередуйте. Это развивает контроль и помогает почувствовать разницу. Метроном: 60 BPM."},{"n":"Амплитуда вибрато","d":"Пойте вибрато с широкой амплитудой (полтона вверх-вниз), затем сужайте до четверти тона. Тренируйте гибкость — от широкого к узкому и обратно."},{"n":"Вибрато в фразе","d":"Возьмите любую песню — добавьте вибрато только на долгие ноты (2+ удара). Краткие ноты — прямой тон. Это стандарт профессионального пения."}],"tips":["Вибрато должно быть естественным — не \"трясите\" голосом насильно","Оптимум: 5–7 колебаний в секунду","Расслабленная челюсть — ключ к красивому вибрато","Слушайте оперных певцов для понимания эталона"],"err":["Вибрато нижней челюстью — это тряска, а не вибрато","Слишком быстрое вибрато — создаёт нервозный звук","Добавлять ко всем нотам без исключения","Форсировать при усталости голоса"]},{"id":"belting","e":"💪","t":"Белтинг","l":"a","xp":150,"dr":"30 мин","d":"Белтинг — продвинутый вокальный приём. Это приложение не может определить, безопасно ли он выполняется, и его показатель спектра не является оценкой техники. Осваивайте приём только с квалифицированным педагогом; не добивайтесь звука громкостью или напряжением.","ex":[{"n":"Разбор с педагогом","d":"Под руководством педагога разберите подходящий именно вам вариант звучания. Не используйте приложение для самостоятельного повышения громкости или поиска предельных нот."},{"n":"Комфортная практика","d":"В приложении можно выполнять только знакомые комфортные упражнения на удобной высоте и тихой/средней громкости. При любом дискомфорте остановитесь."}],"tips":["Не ориентируйтесь на процент приложения как на подтверждение техники.","Не увеличивайте громкость ради результата.","Остановитесь при боли, першении, осиплости или напряжении."],"err":["Форсировать громкость или высоту.","Продолжать при дискомфорте.","Считать яркий спектр доказательством правильной или безопасной техники."]},{"id":"twang","e":"🎺","t":"Твенг","l":"m","xp":120,"dr":"20 мин","d":"Твенг описывает яркое качество тембра. Встроенный индикатор отражает лишь долю высокочастотной энергии и не может подтвердить технику, резонанс или безопасность.","ex":[{"n":"Сравнение тембра","d":"На удобной высоте произнесите короткую фразу обычным комфортным голосом. Не пытайтесь намеренно сжимать горло или увеличивать громкость."},{"n":"Слушайте без усилия","d":"Если педагог уже показал вам этот приём, сравните звучание с его образцом. Не используйте щипок носа или показатель приложения как тест правильности."},{"n":"Стоп при дискомфорте","d":"При боли, першении, осиплости или ощущении зажима прекратите упражнение и не повторяйте его через усилие."}],"tips":["Работайте только в комфортном диапазоне.","Яркость сигнала не доказывает качество или безопасность техники.","Остановитесь при любом дискомфорте."],"err":["Напрягать шею или гортань.","Повышать громкость ради яркого показателя.","Считать изменение звука при зажатом носе диагностикой твенга."]},{"id":"riff","e":"🔥","t":"Расщепление","l":"a","xp":180,"dr":"35 мин","d":"Экстремальные вокальные эффекты могут создавать нагрузку. Приложение не может определить безопасное выполнение, поэтому самостоятельная практика расщепления, гроула и дисторшна здесь отключена до профессиональной проверки материалов.","ex":[{"n":"Обсудите технику с педагогом","d":"Не пытайтесь самостоятельно воспроизводить расщепление, гроул или дисторшн по текстовым подсказкам приложения."},{"n":"Не имитируйте кашель или давление","d":"Не создавайте звук через откашливание, сжатие горла, боль или першение. Раздел приложения пока недоступен."}],"tips":["Для этой техники обратитесь к квалифицированному педагогу.","Не практикуйте экстремальные звуки через усилие.","Прекратите пение при боли, першении или осиплости."],"err":["Имитировать откашливание или давление в горле.","Считать, что разогрев или вода гарантируют безопасность.","Продолжать при боли, першении или осиплости."]},{"id":"melisma","e":"🎶","t":"Мелизматика","l":"a","xp":160,"dr":"30 мин","d":"Пробежки, рулады и украшения — агилити вокального голоса. Характерны для R&B, Gospel, Pop. Требуют отличной интонации и быстрого переключения регистров.","ex":[{"n":"Трезвучие туда-обратно","d":"Быстро поём До–Ми–Соль–Ми–До и обратно на \"а\". Начните 60 BPM, ускоряйте до 120. Каждая нота должна звучать чисто! Метроном обязателен."},{"n":"Пентатоника R&B","d":"До–Ре–Ми–Соль–Ля–До туда-обратно в быстром темпе. База агилити: 80 BPM → +10 BPM каждые 3 дня занятий. Не жертвуйте точностью ради скорости."},{"n":"Скользящие украшения","d":"На слоге \"а\" сделайте украшение: 3–4 ноты вниз или вверх от основной. Начните сверху вниз. Слушайте Марайю Кэри для понимания эталона."},{"n":"Рулада gospel","d":"На \"еее\" пройдите 5–7 нот вверх и вниз как горка. Акцент на первой и последней ноте. Стандартный gospel-пробег. Скорость: 80 BPM → постепенно выше."},{"n":"Украшение в тексте","d":"Возьмите строку из любимой песни. Добавьте украшение на выделенное слово: 4-нотное вниз на последнем слоге слова \"любовь\". Пробуйте разные варианты."}],"tips":["Чистота интонации важнее скорости!","Слушайте Whitney Houston, Beyoncé для вдохновения","Не всегда уместна — музыкальный вкус важнее виртуозности","Записывайте свои украшения — развивает музыкальность"],"err":["Слишком много украшений — выглядит вульгарно","Расплывчатые ноты вместо чётких звуков","Добавлять мелизматику везде подряд","Игнорировать метроном при тренировке скорости"]}],"SCALES":[{"n":"До мажор","s":"До · Ре · Ми · Фа · Соль · Ля · Си · До","d":"Основа всех мажорных гамм — начало всего"},{"n":"Ля минор","s":"Ля · Си · До · Ре · Ми · Фа · Соль · Ля","d":"Натуральный минор, очень выразительный"},{"n":"До пентатоника","s":"До · Ре · Ми · Соль · Ля · До","d":"5-ноточная основа блюза и R&B"},{"n":"Ля блюз","s":"Ля · До · Ре · Ре# · Ми · Соль · Ля","d":"Блюзовая с уменьшенной квинтой"},{"n":"Ми фригийский","s":"Ми · Фа · Соль · Ля · Си · До · Ре · Ми","d":"Испанский / фламенко лад, экзотика"}],"LVS":[{"min":0,"max":100,"n":"Новичок","e":"🌱","l":1},{"min":100,"max":250,"n":"Любитель","e":"🎵","l":2},{"min":250,"max":500,"n":"Ученик","e":"🎤","l":3},{"min":500,"max":800,"n":"Продвинутый","e":"⭐","l":4},{"min":800,"max":1200,"n":"Мастер","e":"🏆","l":5},{"min":1200,"max":1000000000.0,"n":"Виртуоз","e":"👑","l":6}]}),LESSONS=D.LS,SCALES=D.SCALES,LVS=D.LVS;
